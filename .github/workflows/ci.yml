name: Astlin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install HTTP development libraries on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - name: Verify toolchain
        run: python -m astlin doctor --ai
      - name: Compiler, runtime, CLI, and offline installation tests
        run: python -m unittest discover -s tests -v
      - name: Astlin programs under sanitizers
        run: python -m astlin test --sanitize
      - name: Build and verify release artifacts
        run: python tools/prepare_release.py
